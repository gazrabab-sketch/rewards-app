name: Build Rewards APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/
          mv /tmp/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          # symlink المسار القديم الذي يبحث عنه buildozer
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
                 $HOME/android-sdk/tools/bin/sdkmanager
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager \
                 $HOME/android-sdk/tools/bin/avdmanager

          echo "ANDROID_HOME=$HOME/android-sdk"       >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk"   >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/tools/bin"          >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools"     >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root=$HOME/android-sdk \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

      - name: Download NDK
        run: |
          mkdir -p $HOME/android-sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip \
               -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME/android-sdk/ndk/
          mv $HOME/android-sdk/ndk/android-ndk-r25b \
             $HOME/android-sdk/ndk/25.2.9519653
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: buildozer android debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rewards-center-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
