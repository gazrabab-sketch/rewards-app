name: Build Rewards APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK inside Kivy Docker image
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rewards-center-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
